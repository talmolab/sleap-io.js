name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag/branch/SHA) to build and publish to npm"
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      # npm is retained only for the publish step below: trusted publishing
      # (OIDC) and provenance are npm-registry features that `bun publish` does
      # not support. Dependency install and the build run on Bun.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # npm trusted publishing (OIDC, tokenless) requires npm >= 11.5.1.
      # Node 22 bundles npm 10.x, which can sign provenance but cannot
      # authenticate via OIDC, so publish 404s. Pin an exact known-good
      # version rather than @latest (a broken @latest sank the v0.3.0 publish).
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.16.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Publish
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          HAS_HYPHEN=false
          case "$PKG_VERSION" in
            *-*) HAS_HYPHEN=true ;;
          esac

          if [ "$EVENT_NAME" = "release" ]; then
            if [ "${RELEASE_TAG#v}" != "$PKG_VERSION" ]; then
              echo "::error::Release tag '$RELEASE_TAG' does not match package.json version '$PKG_VERSION'."
              exit 1
            fi
            if [ "$IS_PRERELEASE" = "true" ] && [ "$HAS_HYPHEN" != "true" ]; then
              echo "::error::GitHub pre-release requires a SemVer prerelease version in package.json (e.g. 0.6.0-alpha.0), got '$PKG_VERSION'."
              exit 1
            fi
            if [ "$IS_PRERELEASE" != "true" ] && [ "$HAS_HYPHEN" = "true" ]; then
              echo "::error::package.json version '$PKG_VERSION' is a prerelease; mark the GitHub release as a pre-release."
              exit 1
            fi
          fi

          if [ "$HAS_HYPHEN" = "true" ]; then
            npm publish --access public --provenance --tag prerelease
          else
            npm publish --access public --provenance
          fi
